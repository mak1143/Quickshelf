<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <title>Quickshelf</title>
    <link rel="stylesheet" href="./build/app.css" />
  </head>
  <body class="h-full bg-[var(--color-bg)] text-[var(--color-text)] antialiased">
    <div class="flex h-screen flex-col">
      <header
        class="flex items-center justify-between border-b border-[var(--color-divider)] px-4 py-3 select-none [-webkit-app-region:drag]"
      >
        <span class="text-sm font-semibold tracking-wide">Quickshelf</span>
        <button
          id="quit"
          type="button"
          aria-label="Quit Quickshelf"
          class="inline-flex h-7 w-7 items-center justify-center rounded-full border-0 bg-[var(--color-fill)] text-[var(--color-text-secondary)] hover:bg-[var(--color-fill-strong)] hover:text-[var(--color-text)] [-webkit-app-region:no-drag]"
        >
          &times;
        </button>
      </header>
      <main class="flex flex-1 items-center justify-center p-6">
        <p class="text-[0.8125rem] text-[var(--color-text-tertiary)]">Phase 1 scaffold</p>
      </main>
    </div>
    <script src="./build/renderer.js"></script>
  </body>
</html>
