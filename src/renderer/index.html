<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <title>Quickshelf</title>
    <link rel="stylesheet" href="./build/app.css" />
  </head>
  <body class="bg-[var(--color-bg)] text-[var(--color-text)] antialiased">
    <div class="flex h-screen flex-col">
      <header
        class="flex items-center justify-between border-b border-[var(--color-divider)] px-4 py-3 select-none [-webkit-app-region:drag]"
      >
        <span class="text-sm font-semibold tracking-wide">Quickshelf</span>
        <button
          id="quit"
          type="button"
          aria-label="Quit Quickshelf"
          class="inline-flex h-7 w-7 items-center justify-center rounded-full border-0 bg-[var(--color-fill)] text-[var(--color-text-secondary)] hover:bg-[var(--color-fill-strong)] hover:text-[var(--color-text)] [-webkit-app-region:no-drag]"
        >
          &times;
        </button>
      </header>
      <nav
        id="tabs"
        aria-label="Shelf tabs"
        class="flex items-center gap-1 overflow-x-auto overflow-y-hidden border-b border-[var(--color-divider)] px-2 py-1.5"
      ></nav>
      <main id="dropzone" class="relative flex flex-1 flex-col overflow-y-auto p-2 transition-colors">
        <ul id="items" class="flex flex-col gap-1"></ul>
        <div
          id="empty"
          class="pointer-events-none flex flex-1 flex-col items-center justify-center gap-2 px-6 text-center"
        >
          <p class="text-[0.8125rem] text-[var(--color-text-tertiary)]">Drop files, links, or text here</p>
        </div>
      </main>
    </div>
    <script src="./build/renderer.js"></script>
  </body>
</html>
